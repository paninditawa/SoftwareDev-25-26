name: CI

on:
  push:
  pull_request:

jobs:
  smoke-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install OS audio build deps
        # PyAudio requires PortAudio headers on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y portaudio19-dev python3-dev pkg-config
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            brew install portaudio
          fi

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Repo import smoke test
        # use bash so the heredoc works on Windows too
        shell: bash
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root))
          # games run from the games/ dir, so game_theme and other shared modules live there
          sys.path.insert(0, str(root / "games"))
          try:
              import tts
              import games.maze_game
              print('imports OK')
          except Exception as e:
              print('import failed:', e)
              raise
          PY
